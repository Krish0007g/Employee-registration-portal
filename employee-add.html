<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Registration portal</title>

    <link rel="icon" href="images/employee.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>


    <nav class="navbar navbar-dark bg-primary">

        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand" href="#" id="id33">
                <img src="images/employee.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
                <strong>Employee Portal</strong>
            </a>


            <div class="d-flex gap-3 align-items-center">
                <a href="#" id="id29" style = "color: white; text-decoration: none;">Logout</a>
            </div>

        </div>

    </nav>



    <div class="class08">

        <div class="class09">

            <h2 id="id32">Employee Registration</h2>

            <div id="id31" class="alert alert-success d-none" role="alert"></div>

            <form id="id30" novalidate>

                <div class="class10">

                    <div>

                        <label for="id04">First Name</label>

                        <input type="text"
                               id="id04"
                               class="class03"
                               placeholder="First name"
                               required>

                        <p id="id04err" class="class15"></p>

                    </div>


                    <div>

                        <label for="id05">Last Name</label>

                        <input type="text"
                               id="id05"
                               class="class03"
                               placeholder="Last name"
                               required>

                        <p id="id05err" class="class15"></p>

                    </div>

                </div>

                <div class="class10">

                    <div>

                        <label for="id06">Email</label>

                        <input type="email"
                               id="id06"
                               class="class03"
                               placeholder="Email"
                               required>

                        <p id="id06err" class="class15"></p>

                    </div>


                    <div>

                        <label for="id07">Phone Number</label>

                        <input type="tel"
                               id="id07"
                               class="class03"
                               placeholder="Phone number"
                               required>

                        <p id="id07err" class="class15"></p>

                    </div>

                </div>



                <div class="class10">

                    <div>

                        <label for="id08">Department</label>

                        <select id="id08"
                                class="class03"
                                required>

                            <option value="">Select Department</option>

                        </select>

                        <p id="id08err" class="class15"></p>

                    </div>


                    <div>

                        <label>Gender</label>

                        <div class="class18">

                            <div class="class04">
                                <input type="radio" name="gender" id="id09Male" value="Male">
                                <label for="id09Male">Male</label>
                            </div>

                            <div class="class04">
                                <input type="radio" name="gender" id="id09Female" value="Female">
                                <label for="id09Female">Female</label>
                            </div>

                            <div class="class04">
                                <input type="radio" name="gender" id="id09Other" value="Other">
                                <label for="id09Other">Other</label>
                            </div>

                        </div>

                        <p id="id09err" class="class15"></p>

                    </div>

                </div>

                <div class="class10">

                    <div>

                        <label for="id23">Designation</label>

                        <select id="id23"
                                class="class03"
                                required>
                            <option value="">Select Designation</option>
                        </select>

                        <p id="id23err" class="class15"></p>

                    </div>


                    <div>

                        <label for="id24">Date of Joining</label>

                        <input type="date"
                               id="id24"
                               class="class03"
                               required>

                        <p id="id24err" class="class15"></p>

                    </div>

                </div>

                <div class="class10">

                    <div>

                        <label for="id10">Date of Birth</label>

                        <input type="date"
                               id="id10"
                               class="class03"
                               required>

                        <p id="id10err" class="class15"></p>

                    </div>


                    <div>

                        <label for="id11">Employee ID</label>

                        <input type="text"
                               id="id11"
                               class="class03"
                               readonly>

                    </div>

                </div>

                <div class="class10">

                    <div>

                        <label for="id27">Salary</label>

                        <input type="text"
                               id="id27"
                               class="class03"
                               placeholder="Enter salary"
                               required>

                        <p id="id27err" class="class15"></p>

                    </div>


                    <div>

                        <label for="id25">Profile Photo</label>

                        <input type="file"
                               id="id25"
                               class="class03"
                               accept="image/jpeg,image/png">

                        <img id="id26" class="class19">

                        <p id="id25err" class="class15"></p>

                    </div>

                </div>



                <label for="id12">Address</label>

                <textarea id="id12"
                          class="class03"
                          rows="3"
                          placeholder="Enter address"
                          required></textarea>

                <p id="id12err" class="class15"></p>



                <div class="class10">

                    <div>

                        <label for="id13">Password</label>

                        <input type="password"
                               id="id13"
                               class="class03"
                               placeholder="Enter password"
                               required>

                        <p id="id13err" class="class15"></p>

                    </div>


                    <div>

                        <label for="id14">Confirm Password</label>

                        <input type="password"
                               id="id14"
                               class="class03"
                               placeholder="Confirm password"
                               required>

                        <p id="id14err" class="class15"></p>

                    </div>

                </div>

                <p id="id16" class="class15"></p>

                <div class="class04">

                    <input type="checkbox"
                           id="id15"
                           required>

                    <label for="id15">I agree to the terms and conditions</label>

                </div>
                
                <p id="id15err" class="class15"></p>

                <button type="submit" class="class05">Register</button>
                <button type="reset"class="class11">Reset</button>

            </form>

        </div>

    </div>

    <script src="js/common.js"></script>
    <script src="js/employee-form.js"></script>

</body>

</html>
